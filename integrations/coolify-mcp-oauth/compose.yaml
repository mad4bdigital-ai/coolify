# Non-production, isolated OAuth-to-Coolify-MCP adapter.
# Identity: Google OpenID Connect (Google Cloud OAuth web client in Testing mode).
# One private Redis service only for proxy replay state. No public host port mappings.
# Do not deploy on the production VPS without a reviewed staging rollout.
services:
  coolify-mcp-oauth:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      oauth-redis:
        condition: service_healthy
    environment:
      PROD_MODE: "true"
      OIDC_ISSUER_URL: "https://accounts.google.com"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?Google OAuth web client ID required}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?Google OAuth web client secret required}"
      PROXY_BASE_URL: "${PROXY_BASE_URL:?Dedicated HTTPS adapter URL required}"
      UPSTREAM_MCP_URL: "https://coolify.infra.mad4b.com/mcp"
      UPSTREAM_AUTHORIZATION_HEADER: "${UPSTREAM_AUTHORIZATION_HEADER:?Read-only Coolify Bearer required}"
      TOKEN_SIGNING_SECRET: "${TOKEN_SIGNING_SECRET:?Unique strong signing key required}"
      REDIS_URL: "redis://oauth-redis:6379/0"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - oauth-state
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  oauth-redis:
    image: redis:7-alpine
    # Run as the image's unprivileged redis user from the outset.
    # Avoid root entrypoint setpriv/setresuid under no-new-privileges.
    user: "redis"
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - oauth-state
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  oauth-state:
    internal: true
