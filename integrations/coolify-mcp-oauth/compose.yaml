services:
  coolify-mcp-oauth:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mcp-provider-registry:
    build:
      context: ./registry
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  oauth-redis:
        condition: service_healthy
    environment:
      PROD_MODE: "true"
      OIDC_ISSUER_URL: "https://accounts.google.com"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?Google OAuth web client ID required}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?Google OAuth web client secret required}"
      PROXY_BASE_URL: "${PROXY_BASE_URL:?Dedicated HTTPS adapter URL required}"
      UPSTREAM_MCP_URL: "https://coolify.infra.mad4b.com/mcp"
      UPSTREAM_AUTHORIZATION_HEADER: "${UPSTREAM_AUTHORIZATION_HEADER:?Read-only Coolify Bearer required}"
      TOKEN_SIGNING_SECRET: "${TOKEN_SIGNING_SECRET:?Unique strong signing key required}"
      REDIS_URL: "redis://oauth-redis:6379/0"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - oauth-state
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  public-file-upload:
    build:
      context: ./upload
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UPLOAD_SIGNING_SECRET: "${UPLOAD_SIGNING_SECRET:?Internal signing secret required}"
      UPLOAD_OAUTH_VERIFY_URL: "http://coolify-mcp-oauth:8080/mcp"
      UPLOAD_MAX_BYTES: "33554432"
      UPLOAD_QUARANTINE: /data/quarantine
      UPLOAD_URL_ALLOWED_HOSTS: "${UPLOAD_URL_ALLOWED_HOSTS:-}"
      UPLOAD_AUTHZ_URL: "${UPLOAD_AUTHZ_URL:-}"
      UPLOAD_AUTHORIZATION_MODE: "oauth_login"
    volumes:
      - upload-quarantine:/data/quarantine
      - /opt/mad4b/uploads/quarantine:/data/server-quarantine
    expose:
      - "8080"
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m

  oauth-redis:
    image: redis:7-alpine
    user: "redis"
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - oauth-state
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  oauth-state:
    internal: true
volumes:
  upload-quarantine: {}
